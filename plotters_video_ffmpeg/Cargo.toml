[package]
name = "plotters_video_ffmpeg"
version = "0.1.1"
edition = "2024"

[dependencies]
ffmpeg-next = { version = "8.1.0", features = ["static", "codec", "device", "format", "software-scaling"], default-features = false }
plotters = "0.3.7"
plotters-backend = "0.3.7"
thiserror = "2.0.18"


[features]
build-ffmpeg = ["ffmpeg-next/build", "ffmpeg-next/build-lib-x264", "ffmpeg-next/build-license-gpl"]
